[package]
name = "fm-platform"
description = "Font Manager platform layer: the FontActivator trait, per-OS implementations, app paths, tray and IPC transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The IPC transport (E29.1, ADR 0016): named pipes on Windows, Unix domain
# sockets on macOS and Linux.
interprocess = "2.4"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
# WebView2's PrintToPdf (ADR 0013); the bindings wry (Tauri) already uses.
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_DirectWrite",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# The WKWebView PDF printer (ADR 0013): the Objective-C bindings wry (Tauri)
# already uses, no default features.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "block2", "objc2"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSApplication",
  "NSEvent",
  "NSGraphics",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSRunningApplication",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "NSDate",
  "NSDictionary",
  "NSError",
  "NSGeometry",
  "NSObject",
  "NSRunLoop",
  "NSString",
  "NSURL",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-app-kit",
  "objc2-core-foundation",
  "WKNavigation",
  "WKWebView",
  "WKWebViewConfiguration",
] }

# The WebKitGTK PDF printer (ADR 0013): the GTK 3 bindings wry (Tauri) already
# uses, at the WebKitGTK API level wry targets. glib and gio come through
# gtk's re-exports, as wry uses them.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
javascriptcore-rs = { version = "1.1", features = ["v2_28"] }
webkit2gtk = { version = "2.0", features = ["v2_38"] }
