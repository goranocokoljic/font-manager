[package]
name = "fm-core"
description = "Font Manager core: scanner, parser, index, search, coverage, previews, activation service, export and catalogs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8"
brotli = "9.0"
flate2 = "1.1"
fm-api.workspace = true
fm-platform.workspace = true
getrandom.workspace = true
harfrust = "0.14"
notify = "8.2"
read-fonts = "0.45"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
skera = "0.8"
skrifa = "0.48"
swash = "0.2.10"
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry", "smallvec"] }
wuff = "0.2.9"

[lints]
workspace = true

# The PDF print test runs the OS UI loop on the main thread (ADR 0013), so it
# has its own `main`.
[[test]]
name = "specimen_pdf"
harness = false
