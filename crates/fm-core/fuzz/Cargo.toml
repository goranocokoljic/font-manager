# cargo-fuzz targets for the parser path (ADR 0002). Not a workspace member:
# it builds on nightly with `cargo +nightly fuzz`, see fuzz_targets/parse.rs and
# fuzz_targets/document_fonts.rs (E32.1) and fuzz_targets/png_decode.rs (E33.1).
[package]
name = "fm-core-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
fm-api = { path = "../../fm-api" }
fm-core = { path = ".." }
libfuzzer-sys = "0.4"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "document_fonts"
path = "fuzz_targets/document_fonts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "png_decode"
path = "fuzz_targets/png_decode.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
