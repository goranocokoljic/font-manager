[package]
name = "fm-mcp"
description = "Font Manager MCP server adapter over fm-api."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
# The stdio shim (E27.7): forwards stdin/stdout to the running app's `/mcp`.
name = "fm-mcp-stdio"
path = "src/bin/fm-mcp-stdio.rs"

[dependencies]
fm-api.workspace = true
fm-client.workspace = true
fm-platform.workspace = true
# The shim uses rmcp's stdio transport and its streamable HTTP client
# transport, nothing else (E27.7).
rmcp = { workspace = true, features = ["client", "transport-io", "transport-streamable-http-client-reqwest"] }
serde.workspace = true
serde_json.workspace = true
# The services are synchronous: tools run on `spawn_blocking` (ADR 0006).
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }

[dev-dependencies]
fm-core.workspace = true
fm-endpoint.workspace = true

[lints]
workspace = true
