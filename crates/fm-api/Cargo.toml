[package]
name = "fm-api"
description = "Font Manager application API: typed, versioned request/response types and service traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "gen-types"
path = "src/bin/gen-types.rs"
required-features = ["gen"]

[features]
# The TypeScript generator behind `pnpm gen:types`; fm-api users do not need it.
gen = ["dep:specta-typescript", "dep:specta-serde"]

[dependencies]
semver = "1"
serde.workspace = true
serde_json.workspace = true
specta = { version = "2.0.0-rc.25", features = ["derive"] }
specta-serde = { version = "0.0.12", optional = true }
specta-typescript = { version = "0.0.12", optional = true }

[lints]
workspace = true
