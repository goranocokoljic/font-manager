[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goranocokoljic/font-manager"
publish = false

[workspace.dependencies]
fm-core = { path = "crates/fm-core" }
fm-api = { path = "crates/fm-api" }
fm-platform = { path = "crates/fm-platform" }
fm-endpoint = { path = "crates/fm-endpoint" }
# The local API endpoint (E25.1, ADR 0015): approved 2026-10-21.
getrandom = "0.3"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
tokio = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.dev.package."*"]
opt-level = 1
