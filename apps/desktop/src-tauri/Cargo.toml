[package]
name = "fm-app"
description = "Font Manager desktop shell (Tauri 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "fm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
fm-api.workspace = true
fm-core.workspace = true
fm-platform.workspace = true
fm-endpoint.workspace = true
fm-mcp.workspace = true
# The plugin config `generate_context!` embeds (tauri.conf.json `plugins`).
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
tracing = "0.1"

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["test"] }

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The DirectWrite probe of the tray integration test (tests/tray_lifecycle.rs).
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_DirectWrite",
  "Win32_System_Registry",
] }
