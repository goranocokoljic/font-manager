# Weekly fuzz run of the parser path (E9.4, ADR 0002): the cargo-fuzz `parse` target
# from E2.2, seeded with its committed corpus and the fixture fonts. A crash, a hang
# or a leak fails the job; the input that caused it is kept as a workflow artifact.
#
# libFuzzer writes the inputs it finds to the first corpus folder, a scratch copy,
# so the committed corpus only changes when a human adds to it.
#
# Linux only: cargo-fuzz (libFuzzer + AddressSanitizer) needs nightly and is best
# supported there, and the parser is platform-free Rust. On a pull request that
# touches the parser or the fuzz crate, a short run proves the target still builds.
name: fuzz

on:
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:
    inputs:
      seconds:
        description: How long to fuzz, in seconds
        default: '1800'
  pull_request:
    paths:
      - .github/workflows/fuzz.yml
      - crates/fm-core/fuzz/**
      - crates/fm-core/src/parser.rs

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  parse:
    name: parse
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: crates/fm-core
    steps:
      - uses: actions/checkout@v7

      - name: Nightly toolchain (cargo-fuzz needs -Z flags)
        run: rustup toolchain install nightly --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
          workspaces: crates/fm-core/fuzz
          cache-on-failure: true

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz the parser
        env:
          SECONDS_TO_RUN: ${{ github.event_name == 'pull_request' && '60' || inputs.seconds || '1800' }}
        run: |
          scratch="$RUNNER_TEMP/corpus-parse"
          mkdir -p "$scratch"
          cargo +nightly fuzz run parse "$scratch" fuzz/corpus/parse ../../fixtures/fonts -- \
            -max_total_time="$SECONDS_TO_RUN" -max_len=1048576 -rss_limit_mb=4096 -timeout=30
          echo "corpus inputs found this run: $(ls "$scratch" | wc -l)"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts-parse
          path: crates/fm-core/fuzz/artifacts/parse/
          if-no-files-found: ignore
          retention-days: 30
