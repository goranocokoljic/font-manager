# CI matrix: the judge for every story. A story is done only when all three
# jobs are green — a Windows-only pass is not a pass.
#
# Check names are "windows", "macos" and "linux" (go-harness matches them as
# `ci / windows` ... in go-harness.config.json `ci.required_checks`).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # 60, not 45: the Windows job alone needs ~25 min on a fast runner and
    # ~48 on a slow one since the stdio shim sidecar build (E27.7) joined it.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
          - name: linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Linux system packages (Tauri, fontconfig)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libfontconfig1-dev fontconfig patchelf \
            desktop-file-utils libssl-dev xvfb

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tauri-build needs the externalBin sidecar for every build of fm-app (E27.7).
      - name: Stdio shim sidecar (fm-mcp-stdio for externalBin)
        run: node scripts/release/sidecar.mjs

      - name: Lint (rustfmt, clippy -D warnings, cargo-deny, ESLint, Prettier, vue-tsc)
        run: pnpm lint

      - name: Rust tests
        shell: bash
        run: |
          # Linux: the PDF print test needs a display for WebKitGTK (ADR 0013).
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a cargo nextest run --workspace --no-tests=warn
          else
            cargo nextest run --workspace --no-tests=warn
          fi
        env:
          # Linux: the autostart test must run desktop-file-validate on the entry (E17.3).
          FM_REQUIRE_DESKTOP_FILE_VALIDATE: ${{ runner.os == 'Linux' && '1' || '' }}

      - name: Shell completions parse (Linux bash and fish)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo run -q -p fm-cli --bin fm -- completions bash > "$RUNNER_TEMP/fm.bash"
          bash -n "$RUNNER_TEMP/fm.bash"
          if command -v fish > /dev/null; then
            cargo run -q -p fm-cli --bin fm -- completions fish > "$RUNNER_TEMP/fm.fish"
            fish --no-execute "$RUNNER_TEMP/fm.fish"
          else
            echo "fish is not installed; the fish check is skipped."
          fi

      - name: Shell completions parse (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = cargo run -q -p fm-cli --bin fm -- completions powershell | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $script.Trim()) { throw 'fm completions powershell printed nothing.' }
          $null = [scriptblock]::Create($script)

      - name: Frontend and harness tests
        run: pnpm test

      - name: Playwright browser
        run: pnpm --filter @fm/desktop exec playwright install --with-deps chromium

      - name: UI end-to-end tests (browser mode on the mock API)
        run: pnpm test:e2e

      - name: Generated types are up to date
        shell: bash
        run: |
          pnpm gen:types
          if ! git diff --exit-code -- apps/desktop/src/api/types.ts; then
            echo "::error file=apps/desktop/src/api/types.ts::types.ts is stale. Run 'pnpm gen:types' and commit the result."
            exit 1
          fi

      - name: Tauri debug build
        run: pnpm tauri build --debug --no-bundle
