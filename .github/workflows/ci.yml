# CI matrix: the judge for every story. A story is done only when all three
# jobs are green — a Windows-only pass is not a pass.
#
# Two exceptions, decided by scripts/harness/ci-scope.mjs from the changed files:
#   light    — only harness scripts and developer docs: the `light` job alone
#              (ESLint and the script tests on Linux).
#   frontend — only Vue/TypeScript frontend code, its tests and static files:
#              the `frontend` job alone (lint:js, Vitest, the desktop build and
#              Playwright on Linux, no Rust toolchain).
# The three OS jobs and the Tauri build are skipped then. go-harness reads
# `ci / light` or `ci / frontend` in their place (go-harness.config.json
# `ci.light_check`, `ci.frontend_check`). A PR labelled `ci:full`, a push to
# main from such a PR and a manual run (workflow_dispatch; the keeper starts one
# for main) are always full.
#
# Check names are "windows", "macos" and "linux" (go-harness matches them as
# `ci / windows` ... in go-harness.config.json `ci.required_checks`).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A PR push cancels the PR's older run. Runs on main never cancel each other:
# a frontend push must not cancel a full run, or its commits stay unproven on
# Windows and macOS (go-harness counts them as uncovered and starts another).
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  # light, frontend or full, from the changed files and the ci:full label.
  # Anything it cannot tell is full.
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/harness/ci-scope.mjs >> "$GITHUB_OUTPUT"

  light:
    name: light
    needs: scope
    if: needs.scope.outputs.scope == 'light'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm exec eslint .

      - name: Script tests (harness, bench, release, docs, community)
        run: pnpm test:scripts

  # Frontend only: what the OS jobs run for the frontend, on Linux, without Rust.
  # The same commands as the `check` job: lint:js is the JS half of `pnpm lint`
  # (ESLint, Prettier, the community check, vue-tsc); the desktop build is
  # vue-tsc and vite build, as `pnpm tauri build` runs it (beforeBuildCommand).
  frontend:
    name: frontend
    needs: scope
    if: needs.scope.outputs.scope == 'frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (ESLint, Prettier, community check, vue-tsc)
        run: pnpm lint:js

      - name: Frontend and harness tests
        run: pnpm test

      - name: Desktop build (vue-tsc and vite build)
        run: pnpm --filter @fm/desktop build

      - name: Playwright browser
        run: pnpm --filter @fm/desktop exec playwright install --with-deps chromium

      - name: UI end-to-end tests (browser mode on the mock API)
        run: pnpm test:e2e

  check:
    name: ${{ matrix.name }}
    needs: scope
    # A failed scope job must not skip the judge: only an explicit "light" or
    # "frontend" does.
    if: ${{ !cancelled() && needs.scope.outputs.scope != 'light' && needs.scope.outputs.scope != 'frontend' }}
    runs-on: ${{ matrix.os }}
    # 90, not 60: the Windows job needs ~53 min on an ordinary runner now and
    # passed 60 on a slow one (PR #569: every step ~30 % slower, cancelled
    # in the end-to-end tests with no test failed).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
          - name: linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Linux system packages (Tauri, fontconfig)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libfontconfig1-dev fontconfig patchelf \
            desktop-file-utils libssl-dev xvfb

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tauri-build needs the externalBin sidecar for every build of fm-app (E27.7).
      - name: Stdio shim sidecar (fm-mcp-stdio for externalBin)
        run: node scripts/release/sidecar.mjs

      - name: Lint (rustfmt, clippy -D warnings, cargo-deny, ESLint, Prettier, vue-tsc)
        run: pnpm lint

      - name: Rust tests
        shell: bash
        run: |
          # Linux: the PDF print test needs a display for WebKitGTK (ADR 0013).
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a cargo nextest run --workspace --no-tests=warn
          else
            cargo nextest run --workspace --no-tests=warn
          fi
        env:
          # Linux: the autostart test must run desktop-file-validate on the entry (E17.3).
          FM_REQUIRE_DESKTOP_FILE_VALIDATE: ${{ runner.os == 'Linux' && '1' || '' }}

      - name: Shell completions parse (Linux bash and fish)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo run -q -p fm-cli --bin fm -- completions bash > "$RUNNER_TEMP/fm.bash"
          bash -n "$RUNNER_TEMP/fm.bash"
          if command -v fish > /dev/null; then
            cargo run -q -p fm-cli --bin fm -- completions fish > "$RUNNER_TEMP/fm.fish"
            fish --no-execute "$RUNNER_TEMP/fm.fish"
          else
            echo "fish is not installed; the fish check is skipped."
          fi

      - name: Shell completions parse (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = cargo run -q -p fm-cli --bin fm -- completions powershell | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $script.Trim()) { throw 'fm completions powershell printed nothing.' }
          $null = [scriptblock]::Create($script)

      - name: Frontend and harness tests
        run: pnpm test

      # E31.2: the Sketch plugin bundle and the zip the release attaches.
      - name: Sketch plugin bundle (font-manager.sketchplugin and its zip)
        shell: bash
        run: |
          pnpm --filter @fm/sketch-plugin build
          test -f plugins/sketch/dist/font-manager.sketchplugin/Contents/Sketch/manifest.json
          test -f plugins/sketch/dist/font-manager.sketchplugin.zip

      - name: Playwright browser
        run: pnpm --filter @fm/desktop exec playwright install --with-deps chromium

      - name: UI end-to-end tests (browser mode on the mock API)
        run: pnpm test:e2e

      - name: Generated types are up to date
        shell: bash
        run: |
          pnpm gen:types
          if ! git diff --exit-code -- apps/desktop/src/api/types.ts; then
            echo "::error file=apps/desktop/src/api/types.ts::types.ts is stale. Run 'pnpm gen:types' and commit the result."
            exit 1
          fi

      - name: Tauri debug build
        run: pnpm tauri build --debug --no-bundle
